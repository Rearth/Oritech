plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = "$minecraft_version-$neoform_version"
    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_mappings
    }
    //    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'

    // Architectury API
    implementation "dev.architectury:architectury-neoforge:$architectury_api_version"

    // owo-lib
    compileOnly "io.wispforest:owo-lib-neoforge:$owo_neo_version"
    annotationProcessor "io.wispforest:owo-lib-neoforge:$owo_neo_version"
    accessTransformers "io.wispforest:owo-lib-neoforge:$owo_neo_version"
    interfaceInjectionData "io.wispforest:owo-lib-neoforge:$owo_neo_version"

    // GeckoLib
    implementation "software.bernie.geckolib:geckolib-common-$minecraft_version:$geckolib_version"

    // EMI
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"

    // REI
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version"

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // Jade (needed for addon)
    implementation "curse.maven:jade-324717:6853386"
    
    // Oracle Index
    compileOnly "curse.maven:oracle-index-1206582:6904573"
}

tasks.named('processResources') {

    from("$rootDir/docs") {
        into "assets/oracle_index/books/oritech"
        exclude '.assets/item/**' // items are rendered in-game as actual item components, no need to include them here
    }

    doLast {
        println "processResources executed: wiki folder copied into assets/oracle_index"
    }
}